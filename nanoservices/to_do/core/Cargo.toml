[package]
name = "to-do-core"
version = "0.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
to-do-dal = { path = "../dal" }
glue = { path = "../../../glue" }
tokio = { version = "1.54.1", features = ["rt"] }

[features]
json-file-storage = ["to-do-dal/json-file"]
postgres-storage = ["to-do-dal/sqlx-postgres"]
default = ["json-file-storage"]
