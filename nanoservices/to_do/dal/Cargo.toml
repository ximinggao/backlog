[package]
name = "to-do-dal"
version = "0.0.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
glue = { path = "../../../glue"}
sqlx = { version = "0.9.0", features = ["postgres", "json", "runtime-tokio"], optional = true }

[features]
json-file = ["dep:serde_json"]
sqlx-postgres = ["dep:sqlx"]
